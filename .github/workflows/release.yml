name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Create the draft release if it does not exist yet
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --title "MDView ${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    # Run even without a tag (workflow_dispatch builds only, uploads nothing)
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            # One universal .dmg instead of separate x64/arm64 builds
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (unsigned, no signing certificates)
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Verify the rpm installs on Rocky Linux 10
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          ls src-tauri/target/release/bundle/rpm/*.rpm
          # Docker Hub anonymous pulls from shared runner IPs get rate-limited
          # intermittently; retry like the upload step does
          for attempt in 1 2 3; do
            docker pull rockylinux/rockylinux:10 && break
            echo "docker pull attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          docker run --rm -v "$PWD/src-tauri/target/release/bundle/rpm:/rpms:ro" \
            rockylinux/rockylinux:10 bash -ec '
              # EPEL on EL10 is minor-version-pinned (unlike epel8/epel9); if this
              # install breaks, suspect EPEL/Rocky packaging, not MDView
              dnf install -y epel-release
              dnf install -y /rpms/*.rpm
              bin=$(rpm -qlp /rpms/*.rpm | grep "^/usr/bin/" | head -n1)
              echo "installed binary: $bin"
              test -x "$bin"
              ldd "$bin" | tee /tmp/ldd.out
              if grep -q "not found" /tmp/ldd.out; then
                echo "FAIL: unresolved shared libraries"; exit 1
              fi
              echo "RPM INSTALL OK on Rocky 10"
            '

      - name: Upload bundles to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # find + read loop: macOS ships bash 3.2 (no globstar, no mapfile)
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find src-tauri/target -type f -path '*/bundle/*' \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \)
          )
          echo "uploading: ${files[*]}"
          test ${#files[@]} -gt 0
          # GitHub's uploads API intermittently returns HTTP 500; retry
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Publish the release (uploads go to a draft)
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-readme:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/readme-bump.yml
    permissions:
      contents: write
    with:
      version: ${{ github.ref_name }}
