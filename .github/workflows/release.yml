name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            # One universal .dmg instead of separate x64/arm64 builds
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (and upload to a draft release on tag pushes)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No signing certificates: builds are unsigned
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "MDView __VERSION__"
          releaseDraft: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Publish the release (tauri-action leaves it as draft)
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump README download links to this version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -E -i "s/(MDView_)[0-9]+\.[0-9]+\.[0-9]+/\1${VER}/g" README.md
          sed -E -i "s#(releases/(tag|download)/v)[0-9]+\.[0-9]+\.[0-9]+#\1${VER}#g" README.md
          sed -E -i "s/\[[0-9]+\.[0-9]+\.[0-9]+\]\(https/[${VER}](https/g" README.md
          if git diff --quiet; then
            echo "README already at ${VER}, nothing to bump"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "README: bump download links to ${VER}"
            git push origin main
          fi
