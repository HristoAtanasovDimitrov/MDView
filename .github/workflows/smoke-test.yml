name: Smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build app binary (no installers)
        run: npx tauri build --no-bundle

      - name: Launch app with a test file and verify the window
        shell: bash
        run: |
          set -e
          printf '# Smoke Test\n\nHello from CI\n' > /tmp/test.md

          APP=src-tauri/target/release/mdview
          test -x "$APP"

          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$APP" /tmp/test.md &
            # The app mirrors the opened document into the native window
            # title ("test.md — MDView"), so probe it with xdotool.
            ok=""
            for i in $(seq 1 30); do
              sleep 1
              if DISPLAY=:99 xdotool search --name "test.md" >/dev/null 2>&1; then ok=1; break; fi
              # xvfb-run picks a free display; fall back to searching them all
              for d in 99 0 1; do
                if DISPLAY=:$d xdotool search --name "test.md" >/dev/null 2>&1; then ok=1; break 2; fi
              done
            done
            test -n "$ok" || { echo "FAIL: no window titled test.md appeared"; exit 1; }
          else
            "$APP" /tmp/test.md &
            APP_PID=$!
            # macOS CI cannot read window titles without accessibility
            # permissions, so assert the process survives startup.
            sleep 10
            kill -0 "$APP_PID" || { echo "FAIL: app exited during startup"; exit 1; }
          fi
          echo "SMOKE TEST PASSED on $RUNNER_OS"
