name: Smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build app binary (no installers)
        run: npx tauri build --no-bundle

      - name: Launch app with a test file and verify the window
        shell: bash
        run: |
          set -e
          printf '# Smoke Test\n\nHello from CI\n' > /tmp/test.md

          APP=src-tauri/target/release/mdview
          test -x "$APP"

          if [ "$RUNNER_OS" = "Linux" ]; then
            Xvfb :99 -screen 0 1280x800x24 &
            export DISPLAY=:99
            # WebKitGTK's compositing/DMA-BUF renderers fail on headless CI
            # (libEGL/DRI3 errors) and the window never renders.
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            sleep 2
            "$APP" /tmp/test.md &
            # The app mirrors the opened document into the native window
            # title ("test.md - MDView"), so probe it with xdotool.
            ok=""
            for i in $(seq 1 60); do
              sleep 1
              if xdotool search --name "test.md" >/dev/null 2>&1; then ok=1; break; fi
            done
            if [ -z "$ok" ]; then
              echo "FAIL: no window titled test.md appeared; windows present:"
              xdotool search --name ".*" getwindowname %@ 2>/dev/null || true
              exit 1
            fi
          else
            "$APP" /tmp/test.md &
            APP_PID=$!
            # macOS CI cannot read window titles without accessibility
            # permissions, so assert the process survives startup.
            sleep 10
            kill -0 "$APP_PID" || { echo "FAIL: app exited during startup"; exit 1; }
          fi
          echo "SMOKE TEST PASSED on $RUNNER_OS"
