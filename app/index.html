<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src file: data: https: http:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>MDView</title>
<style>
  :root {
    --bg:        #14161c;
    --surface:   #1c1f28;
    --surface-2: #232733;
    --line:      #2c3140;
    --text:      #e8e4d9;
    --muted:     #8a8fa3;
    --accent:    #e0a458;
    --accent-dim:#8a6a3f;
    --code:      #8fd0c5;
    --code-bright: #a5e3d3;
    --chip-line: #3d4557;
    --danger:    #d97b6c;
    --doc-width: 72ch;
    --serif: "Sitka Text", Sitka, Georgia, "Times New Roman", serif;
    --mono:  "Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace;
    --sans:  "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Toolbar ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .wordmark {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
    user-select: none;
  }
  .wordmark span { color: var(--muted); font-weight: 400; }

  .filename {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .filename.dirty::after {
    content: " ●";
    color: var(--accent);
  }

  .toolbar-buttons { display: flex; gap: 8px; flex-shrink: 0; }

  button {
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 14px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent-dim); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #14161c; font-weight: 600; }
  button.primary:hover:not(:disabled) { color: #14161c; filter: brightness(1.1); }
  button:focus-visible, a:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-left: 6px;
  }

  /* ---------- Tab strip ---------- */
  .tabstrip-row {
    display: flex;
    align-items: stretch;
    background: var(--surface);
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    min-height: 32px;
  }
  .tabstrip {
    display: flex;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabstrip::-webkit-scrollbar { display: none; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 6px 0 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    border-right: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
    max-width: 220px;
    flex-shrink: 0;
  }
  .tab.active {
    background: var(--bg);
    color: var(--text);
    box-shadow: inset 0 2px 0 var(--accent);
  }
  .tab:hover:not(.active) { background: var(--surface-2); }
  .tab-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab.dirty .tab-name::after { content: " \25CF"; color: var(--accent); }
  .tab-close {
    border: none;
    background: none;
    padding: 2px 5px;
    font-size: 10px;
    color: var(--muted);
    border-radius: 3px;
    line-height: 1;
  }
  .tab-close:hover:not(:disabled) {
    color: var(--danger);
    background: var(--surface-2);
    border: none;
  }
  #btn-newtab {
    border: none;
    border-radius: 0;
    background: var(--surface);
    color: var(--muted);
    padding: 0 14px;
    font-size: 15px;
    flex-shrink: 0;
  }
  #btn-newtab:hover:not(:disabled) { border: none; }

  /* ---------- Recent files menu ---------- */
  .recent-menu {
    position: fixed;
    top: 46px;
    right: 20px;
    display: none;
    min-width: 280px;
    max-width: 440px;
    padding: 6px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    z-index: 6;
  }
  .recent-menu.open { display: block; }
  .recent-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 10px;
    background: none;
    border: none;
    border-radius: 4px;
  }
  .recent-item:hover:not(:disabled) { background: var(--surface); border: none; color: inherit; }
  .recent-item .r-name {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
  }
  .recent-item .r-path {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
  }
  .recent-item:hover .r-name { color: var(--accent); }
  .recent-sep {
    border: none;
    border-top: 1px solid var(--line);
    margin: 6px 0;
  }
  .recent-clear, .recent-empty {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 10px;
    background: none;
    border: none;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .recent-clear:hover:not(:disabled) { background: var(--surface); border: none; color: var(--danger); }

  /* ---------- Save-state rule (signature) ---------- */
  .save-rule {
    height: 2px;
    flex-shrink: 0;
    background: var(--accent-dim);
    transition: background 0.3s;
  }
  .save-rule.dirty { background: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    .save-rule.dirty { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
  }

  /* ---------- Main area ---------- */
  main { flex: 1; display: flex; min-height: 0; }

  .pane { flex: 1; min-width: 0; overflow-y: auto; }

  /* Editor */
  #editor-pane { display: none; border-right: 1px solid var(--line); }
  body.editing #editor-pane { display: block; }

  #editor {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    border: none;
    resize: none;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.7;
    padding: 32px 36px;
    tab-size: 2;
  }
  #editor:focus { outline: none; }

  /* Preview / reading pane */
  #view-pane { display: flex; justify-content: center; }
  #content {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.75;
    max-width: var(--doc-width);
    width: 100%;
    padding: 48px 40px 96px;
  }
  body.editing #content { padding: 32px 36px 96px; }

  /* ---------- Rendered markdown ---------- */
  #content h1, #content h2, #content h3,
  #content h4, #content h5, #content h6 {
    font-family: var(--serif);
    font-weight: 600;
    line-height: 1.3;
    margin: 1.6em 0 0.5em;
    color: var(--accent);
  }
  #content h1:first-child { margin-top: 0; }
  #content h1 { font-size: 2em; border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
  #content h2 { font-size: 1.5em; border-bottom: 1px solid var(--line); padding-bottom: 0.25em; }
  #content h3 { font-size: 1.25em; }
  #content h4 { font-size: 1.05em; }
  #content h5, #content h6 { font-size: 1em; color: var(--muted); }

  #content p, #content ul, #content ol,
  #content blockquote, #content table, #content pre { margin: 0 0 1em; }

  #content ul, #content ol { padding-left: 1.6em; }
  #content li { margin: 0.25em 0; }
  #content li > ul, #content li > ol { margin-bottom: 0; }
  #content li.task { list-style: none; margin-left: -1.3em; }
  #content li.task input { margin-right: 0.5em; accent-color: var(--accent); cursor: pointer; }

  #content a { color: var(--accent); text-decoration-color: var(--accent-dim); }
  #content a:hover { text-decoration-color: var(--accent); }

  #content strong { font-weight: 700; }
  #content em { font-style: italic; }
  #content del { color: var(--muted); }

  #content code {
    font-family: var(--mono);
    font-size: 0.85em;
    color: var(--code-bright);
    background: var(--surface-2);
    border: 1px solid var(--chip-line);
    padding: 0.1em 0.45em;
    border-radius: 4px;
  }

  #content pre {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 18px;
    overflow-x: auto;
  }
  #content pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--code);
  }

  #content blockquote {
    border-left: 3px solid var(--accent-dim);
    padding: 0.1em 0 0.1em 1.2em;
    color: var(--muted);
  }
  #content blockquote > :last-child { margin-bottom: 0; }

  #content hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 2em 0;
  }

  #content table {
    border-collapse: collapse;
    display: block;
    overflow-x: auto;
    font-size: 0.92em;
  }
  #content th, #content td {
    border: 1px solid var(--line);
    padding: 7px 14px;
    text-align: left;
  }
  #content th {
    background: var(--surface);
    font-weight: 600;
  }
  #content tr:nth-child(even) td { background: var(--surface); }

  #content img { max-width: 100%; border-radius: 4px; }

  /* ---------- Find bar ---------- */
  .findbar {
    position: fixed;
    top: 84px;
    right: 20px;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    z-index: 5;
  }
  .findbar.open { display: flex; flex-direction: column; align-items: stretch; }
  .find-row { display: flex; align-items: center; gap: 8px; }
  .replace-row { display: none; }
  .findbar.replace .replace-row { display: flex; }
  .replace-row input { flex: 1; }
  #find-regex { padding: 5px 7px; letter-spacing: 0.05em; }
  #find-regex.active {
    color: var(--accent);
    border-color: var(--accent-dim);
    background: rgba(224, 164, 88, 0.12);
  }
  .findbar input.invalid { border-color: var(--danger); }
  .findbar input {
    font-family: var(--mono);
    font-size: 12px;
    width: 200px;
    padding: 5px 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .findbar input:focus { outline: none; border-color: var(--accent-dim); }
  .findbar button { padding: 5px 9px; }
  #find-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    min-width: 42px;
    text-align: center;
  }
  mark.search-hit {
    background: rgba(224, 164, 88, 0.3);
    color: inherit;
    border-radius: 2px;
  }
  mark.search-hit.current { background: var(--accent); color: #14161c; }

  /* ---------- Status bar ---------- */
  footer {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 6px 16px;
    background: var(--surface);
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
    user-select: none;
  }
  footer .spacer { flex: 1; }
  #save-state.dirty { color: var(--accent); }

  .width-ctl { display: flex; align-items: center; gap: 8px; }
  .width-ctl input[type="range"] {
    width: 110px;
    accent-color: var(--accent);
  }
  .width-ctl button { padding: 2px 8px; font-size: 10px; }
  .width-ctl button:disabled { opacity: 0.5; }
  #width-val { min-width: 34px; }
  @media (max-width: 860px) { .width-ctl { display: none; } }

  /* ---------- Drag overlay ---------- */
  #drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 22, 28, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    border: 2px dashed var(--accent);
    font-family: var(--mono);
    font-size: 16px;
    color: var(--accent);
    pointer-events: none;
  }
  body.dragging #drop-overlay { display: flex; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    body.editing main { flex-direction: column; }
    body.editing #editor-pane {
      border-right: none;
      border-bottom: 1px solid var(--line);
      flex-basis: 50%;
    }
    #content { padding: 28px 20px 64px; }
    kbd { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">MD<span>View</span></div>
  <div class="filename" id="filename">Welcome.md</div>
  <div class="toolbar-buttons">
    <button id="btn-new">New</button>
    <button id="btn-open">Open<kbd>Ctrl+O</kbd></button>
    <button id="btn-recent">Recent &#9662;</button>
    <button id="btn-mode">Edit<kbd>Ctrl+E</kbd></button>
    <button id="btn-save" class="primary" disabled>Save<kbd>Ctrl+S</kbd></button>
  </div>
</header>
<div class="tabstrip-row">
  <div class="tabstrip" id="tabstrip" role="tablist"></div>
  <button id="btn-newtab" title="New tab (Ctrl+T)">+</button>
</div>
<div class="save-rule" id="save-rule"></div>
<div class="recent-menu" id="recent-menu"></div>

<div class="findbar" id="findbar" role="search">
  <div class="find-row">
    <input id="find-input" placeholder="Find in document" aria-label="Find in document">
    <button id="find-regex" title="Regular expression" aria-pressed="false">.*</button>
    <span id="find-count"></span>
    <button id="find-prev" title="Previous match (Shift+Enter)">&#8249;</button>
    <button id="find-next" title="Next match (Enter)">&#8250;</button>
    <button id="find-close" title="Close (Esc)">&#10005;</button>
  </div>
  <div class="find-row replace-row">
    <input id="replace-input" placeholder="Replace with" aria-label="Replace with">
    <button id="replace-one" title="Replace current match (Enter)">Replace</button>
    <button id="replace-all" title="Replace all matches">All</button>
  </div>
</div>

<main>
  <div class="pane" id="editor-pane">
    <textarea id="editor" spellcheck="false" aria-label="Markdown source"></textarea>
  </div>
  <div class="pane" id="view-pane">
    <article id="content"></article>
  </div>
</main>

<footer>
  <span id="stat-words">0 words</span>
  <span id="stat-chars">0 characters</span>
  <span id="stat-reading">&lt;1 min read</span>
  <span class="spacer"></span>
  <span class="width-ctl">
    <label for="width-range">width</label>
    <input type="range" id="width-range" min="50" max="120" step="2" value="72" aria-label="Document width">
    <span id="width-val">72ch</span>
    <button id="width-save">set default</button>
  </span>
  <span id="save-state">saved</span>
</footer>

<div id="drop-overlay">Drop a markdown file to open it</div>
<input type="file" id="file-input" accept=".md,.markdown,.txt,.mdown" multiple hidden>

<script>
"use strict";

/* ================= Markdown renderer ================= */

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderInline(text) {
  // Protect code spans first
  const codeSpans = [];
  text = text.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (m, ticks, code) => {
    codeSpans.push("<code>" + escapeHtml(code.trim()) + "</code>");
    return "\x00" + (codeSpans.length - 1) + "\x00";
  });

  text = escapeHtml(text);

  // Images before links
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g,
    (m, alt, src, title) =>
      `<img src="${src}" alt="${alt}"${title ? ` title="${title}"` : ""}>`);

  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g,
    (m, label, href, title) =>
      `<a href="${href}"${title ? ` title="${title}"` : ""} target="_blank" rel="noopener">${label}</a>`);

  // Autolinks
  text = text.replace(/(^|[\s(])((?:https?:\/\/)[^\s<>)]+)/g,
    (m, pre, url) => `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`);

  // Bold, italic, strikethrough
  text = text.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (m, a, b) => `<strong>${a ?? b}</strong>`);
  text = text.replace(/\*([^*\s][^*]*)\*|\b_([^_\s][^_]*)_\b/g, (m, a, b) => `<em>${a ?? b}</em>`);
  text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");

  // Hard line breaks (two trailing spaces already handled per-line)
  // Restore code spans
  text = text.replace(/\x00(\d+)\x00/g, (m, i) => codeSpans[+i]);
  return text;
}

function renderMarkdown(src, baseLine = 0) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;

  const isBlank = (l) => l === undefined || /^\s*$/.test(l);

  function parseTableRow(line) {
    let row = line.trim();
    if (row.startsWith("|")) row = row.slice(1);
    if (row.endsWith("|")) row = row.slice(0, -1);
    return row.split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  }

  while (i < lines.length) {
    const line = lines[i];

    if (isBlank(line)) { i++; continue; }

    // Fenced code block
    const fence = line.match(/^(\s*)(```|~~~)\s*(\S*)/);
    if (fence) {
      const [, , marker, lang] = fence;
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(marker)) {
        buf.push(lines[i]); i++;
      }
      i++; // closing fence
      out.push(`<pre><code${lang ? ` class="language-${escapeHtml(lang)}"` : ""}>` +
               escapeHtml(buf.join("\n")) + "</code></pre>");
      continue;
    }

    // Heading
    const h = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (h) {
      const lvl = h[1].length;
      out.push(`<h${lvl}>${renderInline(h[2])}</h${lvl}>`);
      i++;
      continue;
    }

    // Horizontal rule
    if (/^\s{0,3}([-*_])\s*(?:\1\s*){2,}$/.test(line)) {
      out.push("<hr>"); i++; continue;
    }

    // Blockquote
    if (/^\s{0,3}>/.test(line)) {
      const bqStart = i; // buf maps 1:1 to source lines from here
      const buf = [];
      while (i < lines.length && (/^\s{0,3}>/.test(lines[i]) || (!isBlank(lines[i]) && buf.length))) {
        if (/^\s{0,3}>/.test(lines[i])) buf.push(lines[i].replace(/^\s{0,3}>\s?/, ""));
        else buf.push(lines[i]);
        i++;
      }
      out.push("<blockquote>" + renderMarkdown(buf.join("\n"), baseLine + bqStart) + "</blockquote>");
      continue;
    }

    // Table: header row + separator row
    if (line.includes("|") && i + 1 < lines.length &&
        /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i + 1])) {
      const headers = parseTableRow(line);
      const aligns = parseTableRow(lines[i + 1]).map(s => {
        const l = s.startsWith(":"), r = s.endsWith(":");
        return l && r ? "center" : r ? "right" : l ? "left" : "";
      });
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && !isBlank(lines[i])) {
        rows.push(parseTableRow(lines[i])); i++;
      }
      let html = "<table><thead><tr>";
      headers.forEach((cell, c) =>
        html += `<th${aligns[c] ? ` style="text-align:${aligns[c]}"` : ""}>${renderInline(cell)}</th>`);
      html += "</tr></thead><tbody>";
      rows.forEach(r => {
        html += "<tr>";
        headers.forEach((_, c) =>
          html += `<td${aligns[c] ? ` style="text-align:${aligns[c]}"` : ""}>${renderInline(r[c] ?? "")}</td>`);
        html += "</tr>";
      });
      html += "</tbody></table>";
      out.push(html);
      continue;
    }

    // List (unordered / ordered, nested by indent)
    const listStart = line.match(/^(\s*)([-*+]|\d+[.)])\s+/);
    if (listStart) {
      const items = []; // { indent, marker, text[] }
      while (i < lines.length) {
        const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m) {
          items.push({ indent: m[1].length, ordered: /\d/.test(m[2]), text: [m[3]], line: baseLine + i });
          i++;
        } else if (!isBlank(lines[i]) && items.length && /^\s+/.test(lines[i])) {
          items[items.length - 1].text.push(lines[i].trim());
          i++;
        } else if (isBlank(lines[i]) && i + 1 < lines.length &&
                   /^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i + 1])) {
          i++;
        } else break;
      }

      function buildList(items, start) {
        const baseIndent = items[start].indent;
        const ordered = items[start].ordered;
        let html = ordered ? "<ol>" : "<ul>";
        let k = start;
        while (k < items.length && items[k].indent >= baseIndent) {
          if (items[k].indent > baseIndent) {
            const sub = buildList(items, k);
            html = html.replace(/<\/li>$/, sub.html + "</li>");
            k = sub.next;
            continue;
          }
          if (items[k].ordered !== ordered) break; // marker type changed: sibling list
          let text = items[k].text.join(" ");
          const task = text.match(/^\[([ xX])\]\s+(.*)$/);
          if (task) {
            html += `<li class="task"><input type="checkbox" data-line="${items[k].line}"` +
                    `${task[1] !== " " ? " checked" : ""}>` + renderInline(task[2]) + "</li>";
          } else {
            html += "<li>" + renderInline(text) + "</li>";
          }
          k++;
        }
        html += ordered ? "</ol>" : "</ul>";
        return { html, next: k };
      }

      let pos = 0;
      while (pos < items.length) {
        const res = buildList(items, pos);
        out.push(res.html);
        pos = res.next;
      }
      continue;
    }

    // Paragraph
    const buf = [];
    while (i < lines.length && !isBlank(lines[i]) &&
           !/^(#{1,6}\s|\s*(```|~~~)|\s{0,3}>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i]) &&
           !/^\s{0,3}([-*_])\s*(?:\1\s*){2,}$/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    if (buf.length) {
      const para = buf.map(l => {
        const hard = /\s{2,}$/.test(l);
        return renderInline(l.trimEnd()) + (hard ? "<br>" : "");
      }).join("\n");
      out.push("<p>" + para + "</p>");
    } else {
      i++; // safety: never stall
    }
  }

  return out.join("\n");
}

let editing = false;

const activeTab = () => tabs.find((t) => t.id === activeId) || null;

/* ================= Rendering & stats ================= */

function render() {
  content.innerHTML = renderMarkdown(editor.value);
  updateStats();
}

function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 120);
}

function updateStats() {
  const text = editor.value;
  const words = (text.match(/\S+/g) || []).length;
  $("stat-words").textContent = words + " word" + (words === 1 ? "" : "s");
  $("stat-chars").textContent = text.length + " characters";
  const mins = Math.ceil(words / 220);
  $("stat-reading").textContent = words < 220 && mins <= 1
    ? "<1 min read" : mins + " min read";
}

function updateChrome() {
  const t = activeTab();
  if (!t) return;
  filenameEl.textContent = t.name;
  filenameEl.title = t.path || t.name;
  filenameEl.classList.toggle("dirty", t.dirty);
  saveRule.classList.toggle("dirty", t.dirty);
  saveState.textContent = t.dirty ? "unsaved changes" : "saved";
  saveState.classList.toggle("dirty", t.dirty);
  btnSave.disabled = !t.dirty;
  document.title = (t.dirty ? "● " : "") + t.name + " — MDView";
}

function setDirty(v) {
  const t = activeTab();
  if (!t) return;
  if (t.dirty !== v) {
    t.dirty = v;
    renderTabs();
  }
  updateChrome();
}

/* ================= Tabs ================= */

function makeTab(text, name, handle, path) {
  return {
    id: nextTabId++,
    path: path || null,
    name,
    handle: handle || null,
    text,
    dirty: false,
    scrollView: 0,
    scrollEdit: 0,
  };
}

function renderTabs() {
  tabstrip.textContent = "";
  for (const t of tabs) {
    const el = document.createElement("div");
    el.className = "tab" + (t.id === activeId ? " active" : "") + (t.dirty ? " dirty" : "");
    el.title = t.path || t.name;
    el.setAttribute("role", "tab");
    el.setAttribute("aria-selected", String(t.id === activeId));

    const label = document.createElement("span");
    label.className = "tab-name";
    label.textContent = t.name;
    el.appendChild(label);

    const close = document.createElement("button");
    close.className = "tab-close";
    close.textContent = "✕";
    close.title = "Close tab (Ctrl+W)";
    close.addEventListener("click", (e) => { e.stopPropagation(); closeTab(t.id); });
    el.appendChild(close);

    el.addEventListener("click", () => selectTab(t.id));
    el.addEventListener("auxclick", (e) => {
      if (e.button === 1) { e.preventDefault(); closeTab(t.id); }
    });
    tabstrip.appendChild(el);
  }
  const act = tabstrip.querySelector(".tab.active");
  if (act) act.scrollIntoView({ inline: "nearest", block: "nearest" });
}

function selectTab(id, force) {
  if (id === activeId && !force) return;
  const cur = activeTab();
  if (cur) {
    cur.text = editor.value;
    cur.scrollEdit = editor.scrollTop;
    cur.scrollView = viewPane.scrollTop;
  }
  activeId = id;
  const t = activeTab();
  if (!t) return;
  editor.value = t.text;
  render();
  editor.scrollTop = t.scrollEdit;
  viewPane.scrollTop = t.scrollView;
  updateChrome();
  renderTabs();
  saveSession();
  if (findOpen) runFind(false);
}

function cycleTab(dir) {
  if (tabs.length < 2) return;
  const idx = tabs.findIndex((t) => t.id === activeId);
  selectTab(tabs[(idx + dir + tabs.length) % tabs.length].id);
}

async function closeTab(id) {
  const t = tabs.find((x) => x.id === id);
  if (!t) return;
  if (t.dirty) {
    if (t.id !== activeId) selectTab(t.id); // show what would be discarded
    if (!(await confirmDiscard())) return;
  }
  const idx = tabs.indexOf(t);
  tabs.splice(idx, 1);
  if (!tabs.length) {
    const w = makeTab(WELCOME, "Welcome.md", null, null);
    tabs.push(w);
    activeId = null;
    selectTab(w.id, true);
  } else if (id === activeId) {
    activeId = null;
    selectTab(tabs[Math.min(idx, tabs.length - 1)].id, true);
  } else {
    renderTabs();
    saveSession();
  }
}

// Open a document in a tab. Focuses the existing tab when the path is already
// open (refreshing clean tabs from the newly read content).
function openDoc(doc, handle, opts = {}) {
  if (doc.path) {
    const existing = tabs.find((t) => t.path === doc.path);
    if (existing) {
      if (!existing.dirty) existing.text = doc.content;
      selectTab(existing.id, true);
      if (!opts.noRecent) addRecent(doc.path, doc.name);
      return existing;
    }
  }
  const t = makeTab(doc.content, doc.name, handle, doc.path);
  tabs.push(t);
  // Opening a real file while the only tab is the untouched Welcome doc replaces it.
  if (doc.path && tabs.length === 2 && !tabs[0].path && !tabs[0].dirty && tabs[0].name === "Welcome.md") {
    tabs.shift();
  }
  selectTab(t.id, true);
  if (doc.path && !opts.noRecent) addRecent(doc.path, doc.name);
  return t;
}

/* ================= Session persistence ================= */

const SESSION_KEY = "mdview.session";

function saveSession() {
  if (!isElectron) return;
  const files = tabs.filter((t) => t.path).map((t) => t.path);
  const act = activeTab();
  const data = { files, active: act && act.path ? files.indexOf(act.path) : -1 };
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch {}
}

function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (s && Array.isArray(s.files)) return s;
  } catch {}
  return null;
}

/* ================= Recent files ================= */

const RECENT_KEY = "mdview.recent";
const RECENT_MAX = 12;
const btnRecent = $("btn-recent");
const recentMenu = $("recent-menu");

function getRecent() {
  try {
    const v = JSON.parse(localStorage.getItem(RECENT_KEY));
    if (Array.isArray(v)) return v.filter((r) => r && typeof r.path === "string");
  } catch {}
  return [];
}

function setRecent(list) {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, RECENT_MAX))); } catch {}
}

function addRecent(path, name) {
  if (!isElectron || !path) return;
  const list = getRecent().filter((r) => r.path !== path);
  list.unshift({ path, name });
  setRecent(list);
}

function removeRecent(path) {
  setRecent(getRecent().filter((r) => r.path !== path));
}

function closeRecentMenu() {
  recentMenu.classList.remove("open");
}

function buildRecentMenu() {
  recentMenu.textContent = "";
  const list = getRecent();
  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "recent-empty";
    empty.textContent = "No recent files";
    recentMenu.appendChild(empty);
    return;
  }
  for (const r of list) {
    const item = document.createElement("button");
    item.className = "recent-item";
    const name = document.createElement("span");
    name.className = "r-name";
    name.textContent = r.name || r.path;
    const path = document.createElement("span");
    path.className = "r-path";
    path.textContent = r.path;
    item.append(name, path);
    item.title = r.path;
    item.addEventListener("click", () => { closeRecentMenu(); openRecent(r.path); });
    recentMenu.appendChild(item);
  }
  const sep = document.createElement("hr");
  sep.className = "recent-sep";
  recentMenu.appendChild(sep);
  const clear = document.createElement("button");
  clear.className = "recent-clear";
  clear.textContent = "Clear recent files";
  clear.addEventListener("click", () => { setRecent([]); closeRecentMenu(); });
  recentMenu.appendChild(clear);
}

async function openRecent(path) {
  try {
    openDoc(await window.mdview.readFile(path));
  } catch {
    alert("Could not open the file (moved or deleted?):\n" + path);
    removeRecent(path);
  }
}

if (isElectron) {
  btnRecent.addEventListener("click", (e) => {
    e.stopPropagation();
    if (recentMenu.classList.contains("open")) { closeRecentMenu(); return; }
    buildRecentMenu();
    recentMenu.classList.add("open");
  });
  window.addEventListener("click", (e) => {
    if (!recentMenu.contains(e.target)) closeRecentMenu();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeRecentMenu();
  });
} else {
  btnRecent.style.display = "none";
}

/* ================= Edit mode ================= */

function setEditing(v) {
  editing = v;
  document.body.classList.toggle("editing", v);
  btnMode.innerHTML = v ? 'View<kbd>Ctrl+E</kbd>' : 'Edit<kbd>Ctrl+E</kbd>';
  if (v) editor.focus();
  if (findOpen) {
    findbar.classList.toggle("replace", replaceOpen && v);
    runFind(false);
  }
}

/* ================= File operations ================= */

const PICKER_TYPES = [{
  description: "Markdown",
  accept: { "text/markdown": [".md", ".markdown", ".mdown", ".txt"] },
}];

async function confirmDiscard() {
  const t = activeTab();
  if (!t || !t.dirty) return true;
  if (isElectron) return window.mdview.confirmDiscard();
  return confirm("You have unsaved changes. Discard them?");
}

async function openFile() {
  if (isElectron) {
    const docs = await window.mdview.openDialog();
    if (docs) docs.forEach((d) => openDoc(d));
  } else if (supportsFS) {
    try {
      const handles = await window.showOpenFilePicker({ types: PICKER_TYPES, multiple: true });
      for (const handle of handles) {
        const file = await handle.getFile();
        openDoc({ content: await file.text(), name: file.name }, handle);
      }
    } catch (e) { /* user cancelled */ }
  } else {
    fileInput.click();
  }
}

async function saveFile() {
  const t = activeTab();
  if (!t) return;
  t.text = editor.value;
  if (isElectron) {
    try {
      if (t.path) {
        await window.mdview.saveFile(t.path, t.text);
        setDirty(false);
      } else {
        const suggested = t.name.endsWith(".md") ? t.name : t.name + ".md";
        const res = await window.mdview.saveAs(t.text, suggested);
        if (res) {
          t.path = res.path;
          t.name = res.name;
          setDirty(false);
          renderTabs();
          addRecent(res.path, res.name);
          saveSession();
        }
      }
    } catch (e) {
      alert("Could not save the file:\n" + (e.message || e));
    }
  } else if (supportsFS) {
    try {
      if (!t.handle) {
        t.handle = await window.showSaveFilePicker({
          suggestedName: t.name.endsWith(".md") ? t.name : t.name + ".md",
          types: PICKER_TYPES,
        });
        t.name = t.handle.name;
        renderTabs();
      }
      const writable = await t.handle.createWritable();
      await writable.write(t.text);
      await writable.close();
      setDirty(false);
    } catch (e) { /* user cancelled */ }
  } else {
    // Fallback: download the file
    const blob = new Blob([t.text], { type: "text/markdown" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = t.name;
    a.click();
    URL.revokeObjectURL(a.href);
    setDirty(false);
  }
}

function newFile() {
  openDoc({ content: "", name: "Untitled.md" });
  setEditing(true);
}

fileInput.addEventListener("change", async () => {
  for (const file of fileInput.files) {
    openDoc({ content: await file.text(), name: file.name });
  }
  fileInput.value = "";
});

/* ================= Drag & drop ================= */

let dragDepth = 0;
window.addEventListener("dragenter", (e) => {
  if (e.dataTransfer?.types.includes("Files")) {
    dragDepth++;
    document.body.classList.add("dragging");
  }
});
window.addEventListener("dragleave", () => {
  if (--dragDepth <= 0) {
    dragDepth = 0;
    document.body.classList.remove("dragging");
  }
});
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", async (e) => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("dragging");
  const items = Array.from(e.dataTransfer?.items || []).filter((it) => it.kind === "file");
  // getAsFile/getAsFileSystemHandle must be collected before any await:
  // the DataTransferItemList is cleared once the event handler yields.
  const picked = items.map((it) => ({
    file: it.getAsFile(),
    handlePromise: !isElectron && supportsFS && it.getAsFileSystemHandle
      ? it.getAsFileSystemHandle().catch(() => null) : null,
  }));
  for (const p of picked) {
    if (!p.file) continue;
    if (isElectron) {
      openDoc({ content: await p.file.text(), name: p.file.name, path: window.mdview.pathForFile(p.file) });
    } else {
      openDoc({ content: await p.file.text(), name: p.file.name }, p.handlePromise ? await p.handlePromise : null);
    }
  }
});

/* ================= Events ================= */

editor.addEventListener("input", () => {
  const t = activeTab();
  if (t) t.text = editor.value;
  setDirty(true);
  scheduleRender();
  if (findOpen) {
    clearTimeout(findTimer);
    findTimer = setTimeout(() => runFind(false), 200);
  }
});

// Tab inserts two spaces instead of leaving the editor
editor.addEventListener("keydown", (e) => {
  if (e.key === "Tab" && !e.shiftKey) {
    e.preventDefault();
    const { selectionStart: s, selectionEnd } = editor;
    editor.setRangeText("  ", s, selectionEnd, "end");
    setDirty(true);
    scheduleRender();
  }
});

$("btn-open").addEventListener("click", openFile);
$("btn-save").addEventListener("click", saveFile);
$("btn-new").addEventListener("click", newFile);
$("btn-newtab").addEventListener("click", newFile);
btnMode.addEventListener("click", () => setEditing(!editing));

/* ================= Task checkbox toggling ================= */

// Task checkboxes carry the absolute source line they came from; clicking one
// flips [ ] / [x] on that line without re-rendering the document.
content.addEventListener("click", (e) => {
  const box = e.target;
  if (!(box instanceof HTMLInputElement) || box.type !== "checkbox") return;
  const line = parseInt(box.dataset.line, 10);
  const t = activeTab();
  if (!t || Number.isNaN(line)) return;
  const lines = editor.value.split("\n");
  const m = (lines[line] || "").match(/^(\s*(?:>\s*)*(?:[-*+]|\d+[.)])\s+\[)( |x|X)\]/);
  if (!m) { render(); return; } // stale mapping: resync the view instead
  let off = m[1].length;
  for (let k = 0; k < line; k++) off += lines[k].length + 1;
  editor.setRangeText(m[2] === " " ? "x" : " ", off, off + 1, "preserve");
  t.text = editor.value;
  setDirty(true);
  updateStats();
});

/* ================= Find in document ================= */

const findbar = $("findbar");
const findInput = $("find-input");
const findCount = $("find-count");
const replaceInput = $("replace-input");

let findOpen = false;
let findRegex = false;
let replaceOpen = false;
let findIndex = -1;
let findJumped = false;
let viewMarks = [];   // view mode: <mark> elements in the rendered document
let editMatches = []; // edit mode: match start offsets in the source text
let findTimer = null;

function openFind(withReplace) {
  if (withReplace && !editing) setEditing(true);
  findOpen = true;
  replaceOpen = !!withReplace;
  findbar.classList.add("open");
  findbar.classList.toggle("replace", replaceOpen);
  if (editing) {
    const sel = editor.value.slice(editor.selectionStart, editor.selectionEnd);
    if (sel && sel.length < 100 && !sel.includes("\n")) findInput.value = sel;
  }
  findInput.focus();
  findInput.select();
  runFind(!editing);
}

function closeFind() {
  findOpen = false;
  replaceOpen = false;
  findbar.classList.remove("open", "replace");
  clearViewMarks();
  updateFindCount();
  if (editing) editor.focus();
}

function clearViewMarks() {
  viewMarks.forEach((m) => {
    const parent = m.parentNode;
    if (!parent) return;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
  viewMarks = [];
}

function updateFindCount() {
  const total = editing ? editMatches.length : viewMarks.length;
  findCount.textContent = findOpen && findInput.value
    ? (total ? (findIndex + 1) + "/" + total : "0/0") : "";
}

function getMatches(text) {
  const q = findInput.value;
  const out = [];
  if (!q) { findInput.classList.remove("invalid"); return out; }
  if (findRegex) {
    let re;
    try {
      re = new RegExp(q, "gi");
      findInput.classList.remove("invalid");
    } catch {
      findInput.classList.add("invalid");
      return out;
    }
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m[0] === "") { re.lastIndex++; continue; } // skip empty matches
      out.push({ start: m.index, end: m.index + m[0].length });
      if (out.length >= 10000) break;
    }
  } else {
    findInput.classList.remove("invalid");
    const lq = q.toLowerCase();
    const lt = text.toLowerCase();
    let pos = 0;
    while ((pos = lt.indexOf(lq, pos)) !== -1) {
      out.push({ start: pos, end: pos + lq.length });
      pos += lq.length;
    }
  }
  return out;
}

function runFind(jump) {
  clearViewMarks();
  editMatches = [];
  findIndex = -1;
  findJumped = false;
  if (!findInput.value) { findInput.classList.remove("invalid"); updateFindCount(); return; }

  if (editing) {
    editMatches = getMatches(editor.value);
    if (editMatches.length) {
      const from = editor.selectionStart;
      findIndex = editMatches.findIndex((m) => m.start >= from);
      if (findIndex === -1) findIndex = 0;
      if (jump) { jumpToEditMatch(); findJumped = true; }
    }
  } else {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);
    for (const node of nodes) {
      const ms = getMatches(node.nodeValue);
      let cur = node;
      let shift = 0;
      for (const mm of ms) {
        const hit = cur.splitText(mm.start - shift);
        const rest = hit.splitText(mm.end - mm.start);
        const mark = document.createElement("mark");
        mark.className = "search-hit";
        hit.parentNode.replaceChild(mark, hit);
        mark.appendChild(hit);
        viewMarks.push(mark);
        shift = mm.end;
        cur = rest;
      }
    }
    if (viewMarks.length) {
      findIndex = 0;
      if (jump) { jumpToViewMatch(); findJumped = true; }
    }
  }
  updateFindCount();
}

function jumpToViewMatch() {
  viewMarks.forEach((m, i) => m.classList.toggle("current", i === findIndex));
  const m = viewMarks[findIndex];
  if (m) m.scrollIntoView({ block: "center" });
}

function jumpToEditMatch() {
  const m = editMatches[findIndex];
  editor.focus();
  editor.setSelectionRange(m.start, m.end);
  const line = (editor.value.slice(0, m.start).match(/\n/g) || []).length;
  const style = getComputedStyle(editor);
  const lh = parseFloat(style.lineHeight) || 24;
  const pad = parseFloat(style.paddingTop) || 0;
  editor.scrollTop = Math.max(0, pad + line * lh - editor.clientHeight / 2);
}

function findStep(dir) {
  const total = editing ? editMatches.length : viewMarks.length;
  if (!total) { runFind(true); return; }
  if (findJumped) findIndex = (findIndex + dir + total) % total;
  findJumped = true;
  if (editing) jumpToEditMatch(); else jumpToViewMatch();
  updateFindCount();
}

findInput.addEventListener("input", () => {
  clearTimeout(findTimer);
  findTimer = setTimeout(() => runFind(!editing), 150);
});

findInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
  else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
});

$("find-prev").addEventListener("click", () => findStep(-1));
$("find-next").addEventListener("click", () => findStep(1));
$("find-close").addEventListener("click", closeFind);

$("find-regex").addEventListener("click", () => {
  findRegex = !findRegex;
  $("find-regex").classList.toggle("active", findRegex);
  $("find-regex").setAttribute("aria-pressed", String(findRegex));
  runFind(!editing);
  findInput.focus();
});

/* ================= Replace ================= */

function replaceCurrent() {
  if (!editing || !editMatches.length || findIndex < 0) return;
  const m = editMatches[findIndex];
  let replacement = replaceInput.value;
  if (findRegex) {
    try {
      replacement = editor.value.slice(m.start, m.end)
        .replace(new RegExp(findInput.value, "i"), replaceInput.value);
    } catch { return; }
  }
  const refocus = document.activeElement;
  editor.setRangeText(replacement, m.start, m.end, "end");
  setDirty(true);
  scheduleRender();
  runFind(true);
  if (refocus && refocus !== editor && refocus.focus) refocus.focus();
}

function replaceAll() {
  if (!editing || !editMatches.length) return;
  const count = editMatches.length;
  let result;
  if (findRegex) {
    try {
      result = editor.value.replace(new RegExp(findInput.value, "gi"), replaceInput.value);
    } catch { return; }
  } else {
    let out = "";
    let last = 0;
    for (const m of editMatches) {
      out += editor.value.slice(last, m.start) + replaceInput.value;
      last = m.end;
    }
    result = out + editor.value.slice(last);
  }
  editor.setRangeText(result, 0, editor.value.length, "start");
  setDirty(true);
  scheduleRender();
  runFind(false);
  findCount.textContent = count + " replaced";
}

$("replace-one").addEventListener("click", replaceCurrent);
$("replace-all").addEventListener("click", replaceAll);

replaceInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); replaceCurrent(); }
  else if (e.key === "Escape") { e.preventDefault(); closeFind(); }
});

/* ================= Global shortcuts ================= */

window.addEventListener("keydown", (e) => {
  if (e.key === "F3") {
    e.preventDefault();
    if (findOpen) findStep(e.shiftKey ? -1 : 1); else openFind();
    return;
  }
  if (e.key === "Escape" && findOpen) { closeFind(); return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  const key = e.key.toLowerCase();
  if (key === "s") {
    e.preventDefault();
    const t = activeTab();
    if (t && (t.dirty || (!t.handle && !t.path))) saveFile();
  }
  else if (key === "o") { e.preventDefault(); openFile(); }
  else if (key === "e") { e.preventDefault(); setEditing(!editing); }
  else if (key === "f") { e.preventDefault(); openFind(); }
  else if (key === "h") { e.preventDefault(); openFind(true); }
  else if (key === "t") { e.preventDefault(); newFile(); }
  else if (key === "w") { e.preventDefault(); if (activeId !== null) closeTab(activeId); }
  else if (key === "tab") { e.preventDefault(); cycleTab(e.shiftKey ? -1 : 1); }
  else if (key === "pagedown") { e.preventDefault(); cycleTab(1); }
  else if (key === "pageup") { e.preventDefault(); cycleTab(-1); }
});

let closing = false;
window.addEventListener("beforeunload", (e) => {
  const anyDirty = tabs.some((t) => t.dirty);
  if (!anyDirty || closing) return;
  if (isElectron) {
    // Electron blocks the close silently; show the native dialog, then re-close.
    e.preventDefault();
    e.returnValue = false;
    window.mdview.confirmDiscard().then((discard) => {
      if (discard) { closing = true; window.close(); }
    });
  } else {
    e.preventDefault();
    e.returnValue = "";
  }
});

/* ================= Document width ================= */

const WIDTH_KEY = "mdview.docWidth";
const widthRange = $("width-range");
const widthVal = $("width-val");
const widthSave = $("width-save");

function storedWidth() {
  let v = NaN;
  try { v = parseInt(localStorage.getItem(WIDTH_KEY), 10); } catch {}
  return v >= 50 && v <= 120 ? v : 72;
}

function updateWidthSave() {
  const isDefault = +widthRange.value === storedWidth();
  widthSave.disabled = isDefault;
  widthSave.textContent = isDefault ? "default" : "set default";
}

function applyWidth(v) {
  document.documentElement.style.setProperty("--doc-width", v + "ch");
  widthVal.textContent = v + "ch";
  if (+widthRange.value !== v) widthRange.value = v;
  updateWidthSave();
}

widthRange.addEventListener("input", () => applyWidth(+widthRange.value));
widthSave.addEventListener("click", () => {
  try { localStorage.setItem(WIDTH_KEY, widthRange.value); } catch {}
  updateWidthSave();
});

applyWidth(storedWidth());

/* ================= Init ================= */

async function init() {
  if (isElectron) {
    window.mdview.onOpenPath((doc) => openDoc(doc));

    // Restore the previous session's tabs (silently dropping missing files),
    // then open the file the app was launched with, if any.
    const session = loadSession();
    if (session) {
      for (const p of session.files) {
        try { openDoc(await window.mdview.readFile(p), null, { noRecent: true }); } catch {}
      }
      const activePath = session.files[session.active];
      const act = activePath && tabs.find((t) => t.path === activePath);
      if (act) selectTab(act.id, true);
    }
    const initial = await window.mdview.getInitialFile();
    if (initial) openDoc(initial);
    if (tabs.length) return;
  }
  openDoc({ content: WELCOME, name: "Welcome.md" });
}

init();
</script>
